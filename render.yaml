# PLACENIX — RENDER PAAS DEPLOYMENT BLUEPRINT
services:
  - type: web
    name: placenix-api-web
    env: node
    plan: starter
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: placenix-postgres
          property: connectionString

databases:
  - name: placenix-postgres
    plan: starter
    databaseName: placenix_db
    user: placenix_user
