<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function() {
      if (!localStorage.getItem('stormy-init')) {
        localStorage.setItem('placenix-theme', 'light');
        localStorage.setItem('placenix-palette', '');
        localStorage.setItem('stormy-init', 'true');
      }
      const saved = localStorage.getItem('placenix-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      // Restore colour palette to prevent flash of default colours
      const savedPalette = localStorage.getItem('placenix-palette') || '';
      if (savedPalette) {
        document.documentElement.setAttribute('data-palette', savedPalette);
      } else {
        document.documentElement.removeAttribute('data-palette');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Placenix — AI-Powered Employability & Campus Recruitment Operating System for universities and colleges. Streamline placements with intelligent analytics, resume scoring, and recruitment automation.">
  <meta property="og:title" content="Placenix | AI Placement OS">
  <meta property="og:description" content="The future operating system for university placements and employability intelligence.">
  <title>Placenix | AI-Powered Campus Recruitment OS</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,450;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style/tokens.css">
  <link rel="stylesheet" href="style/reset.css">
  <link rel="stylesheet" href="style/animations.css">
  <link rel="stylesheet" href="style/layout.css">
  <link rel="stylesheet" href="style/components.css">

  <!-- Core Libraries (UMD Fallbacks) & AI Proctoring Models -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <!-- __ENV_PLACEHOLDER__ -->

  <style>
    /* ── Diagnostic Console ── */
    #placenix-error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #09090b;
      z-index: 99999;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      padding: 40px;
      overflow-y: auto;
    }
    #app {
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 1024px) {
      #mobile-menu-btn { display: flex !important; }
    }
  </style>

  <script>
    // ── Universal Exception Catcher ──
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const overlay = document.getElementById('placenix-error-overlay');
      if (overlay) {
        overlay.style.display = 'block';
        overlay.innerHTML = `
          <div style="max-width:800px; margin:0 auto;">
            <div style="font-size:40px; margin-bottom:20px;">🚨</div>
            <h2 style="color:#ef4444; font-size:20px; margin-bottom:12px;">Global Exception Trapped</h2>
            <p style="color:#a1a1aa; font-size:14px; margin-bottom:24px;">The application environment has encountered a fatal script error during the boot sequence.</p>
            <div style="padding:20px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); border-radius:8px; color:#ef4444; font-size:13px; line-height:1.6; white-space:pre-wrap;">
              Error: ${msg}
              Source: ${url}
              Position: L${lineNo}:C${columnNo}
              Stack: ${error ? error.stack : 'N/A'}
            </div>
            <button onclick="location.reload()" style="margin-top:32px; padding:12px 24px; background:#7c3aed; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer;">Retry Boot Sequence</button>
          </div>
        `;
      }
      return false;
    };
    window.onunhandledrejection = function(event) {
      console.error('Unhandled rejection:', event.reason);
      // Optional: trigger overlay for async errors too
    };
  </script>
</head>
<body>
  <div id="placenix-error-overlay"></div>

  <!-- Global App Boot Loader -->
  <div id="placenix-loader" class="placenix-loader-overlay">
    <div class="placenix-loader-bg"></div>
    <div class="placenix-loader-content">
      <div class="placenix-loader-logo-container">
        <img src="logo.png" alt="Placenix Logo" class="placenix-loader-logo" onerror="this.src='https://img.icons8.com/neon/96/artificial-intelligence.png';">
      </div>
      <h1 class="placenix-loader-title">Place<span>nix</span></h1>
      <p class="placenix-loader-subtitle">Campus Recruitment OS</p>
      <div class="placenix-loader-progress-track">
        <div id="placenix-loader-bar" class="placenix-loader-progress-bar"></div>
      </div>
      <div id="placenix-loader-status" class="placenix-loader-status">Initializing systems...</div>
    </div>
  </div>

  <div id="app"></div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- App entry -->
  <script type="module" src="main.js"></script>
</body>
</html>
